services:
  postgres:
    image: postgres:16
    container_name: resqgrid-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: resqgrid
      POSTGRES_PASSWORD: resqgrid_password
      POSTGRES_DB: resqgrid

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: