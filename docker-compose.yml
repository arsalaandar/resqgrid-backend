services:
  postgres:
    image: postgres:16
    container_name: resqgrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: resqgrid
      # Override with POSTGRES_PASSWORD in your shell or a compose .env file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resqgrid_password}
      POSTGRES_DB: resqgrid
    ports:
      # Bind to localhost only so the database is not reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqgrid -d resqgrid"]
      interval: 10s
      timeout: 5s
      retries: 5

    # The API as a container, with fixed resource limits, for repeatable tests.
  # Start it with: docker compose --profile app up -d --build
  migrate:
    build: .
    image: resqgrid-api:local
    profiles: ["app"]
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      # Inside Docker the database is reached by service name, not 127.0.0.1.
      DATABASE_URL: postgresql+psycopg://resqgrid:${POSTGRES_PASSWORD:-resqgrid_password}@postgres:5432/resqgrid
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    image: resqgrid-api:local
    container_name: resqgrid-api
    profiles: ["app"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://resqgrid:${POSTGRES_PASSWORD:-resqgrid_password}@postgres:5432/resqgrid
      INCIDENT_PHOTO_STORAGE_DIR: /app/storage/incident_photos
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - photos_data:/app/storage
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Monitoring stack. Start it with:
  #   docker compose --profile monitoring up -d
  # A plain "docker compose up -d" still starts only the database.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: resqgrid-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/metrics_token:/etc/prometheus/metrics_token:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      # Lets the container reach the app running on your computer.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.1.0
    container_name: resqgrid-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # Local use only (bound to 127.0.0.1). Change it before exposing Grafana.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  photos_data:
  prometheus_data:
  grafana_data:
