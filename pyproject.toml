[project]
name = "resqgrid-backend"
version = "1.0.0"
description = "Emergency incident reporting and response platform API"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.161.1",
    "uvicorn[standard]==0.54.0",
    "SQLAlchemy==2.1.6",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
    "PyJWT==2.15.1",
    "pwdlib[argon2]==0.3.1",
    "pydantic-settings==2.16.1",
    "pillow==13.0.0",
    "python-multipart==0.0.32",
    "slowapi==0.1.10",
    "redis==8.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-dotenv==0.5.2",
    "httpx==0.28.1",
    "ruff==0.17.1",
]

[tool.uv]
# This is an application, not an installable package.
package = false

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# env.py must import the models for their side effect (registering tables on
# Base.metadata) after configuring settings, so these rules do not apply.
"alembic/env.py" = ["E402", "F401", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Loads .env (including TEST_DATABASE_URL) so tests do not need a manual
# $env:TEST_DATABASE_URL in every new shell. Requires pytest-dotenv.
env_files = [".env"]
