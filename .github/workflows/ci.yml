name: CI

on:
  push:
    branches: [main]
  # No branch filter: stacked branches open PRs against each other,
  # and every one of them should be checked.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Check formatting
        run: uv run --frozen ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resqgrid
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: resqgrid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resqgrid -d resqgrid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      # Throwaway values that exist only inside CI. They satisfy the
      # startup validation (32+ chars, and the two secrets must differ).
      JWT_SECRET_KEY: ci-only-jwt-secret-0123456789abcdefghij
      OTP_HMAC_SECRET: ci-only-otp-secret-9876543210zyxwvutsr
      OTP_PROVIDER: console
      RATE_LIMIT_STORAGE_URI: memory://
      DATABASE_URL: postgresql+psycopg://resqgrid:ci_password@localhost:5432/resqgrid
      TEST_DATABASE_URL: postgresql+psycopg://resqgrid:ci_password@localhost:5432/resqgrid_test
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies from the lock file
        # --frozen fails the build if uv.lock is out of date with pyproject.toml.
        run: uv sync --frozen
      - name: Create test database
        run: >-
          psql "postgresql://resqgrid:ci_password@localhost:5432/resqgrid"
          -c "CREATE DATABASE resqgrid_test"
      - name: Migrate application database
        run: uv run --frozen alembic upgrade head
      - name: Migrate test database
        run: uv run --frozen alembic upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Run tests
        run: uv run --frozen python -m pytest -q --cov=app --cov-report=term-missing