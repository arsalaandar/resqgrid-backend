global:
  # Every 5 seconds so graphs react quickly while you experiment.
  # Production setups usually use 15 seconds.
  scrape_interval: 5s

scrape_configs:
  - job_name: resqgrid
    metrics_path: /metrics
    static_configs:
      # The app runs on your computer, outside Docker, on port 8000.
      - targets: ["host.docker.internal:8000"]
    # If you set METRICS_TOKEN, uncomment this and put the same token here.
    # Do not commit a real token.
    # authorization:
    #   type: Bearer
    #   credentials: "your-metrics-token"
